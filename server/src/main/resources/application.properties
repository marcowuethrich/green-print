quarkus.http.port=8080

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none

# --- Dev Profile ---
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.hibernate-orm.schema-management.strategy=update

# --- Test Profile ---
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.datasource.devservices.reuse=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.enabled=false