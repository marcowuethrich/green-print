quarkus.http.port=8080

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=none

# --- Dev Profile ---
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.hibernate-orm.database.generation=update

# --- Test Profile ---
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.enabled=true
%test.quarkus.oidc.discovery-enabled=false
%test.quarkus.oidc.auth-server-url=http://localhost:8081/realms/quarkus
%test.quarkus.oidc.jwks-path=/protocol/openid-connect/certs