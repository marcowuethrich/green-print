quarkus.http.port=8080

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none

# --- Dev Profile ---
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.oidc.enabled=false
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:8081
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
%dev.quarkus.http.cors.headers=origin,content-type,accept,authorization,x-requested-with
%dev.quarkus.http.cors.access-control-allow-credentials=true

# --- Test Profile ---
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.datasource.devservices.reuse=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.enabled=false